---
# 启动示例：
#   ansible-playbook -i codeart_505B_DSA_A3_INT4_4P8_1D8_fusion_pool_mtp7_inventory.yml \
#     codeart_505B_DSA_A3_INT4_4P8_1D8_fusion_pool_mtp7_server.yml \
#     --tags stop_server,run_docker,run_server,run_proxy
- name: Run PanguV2 505B W4A8 4P8-1D8 Prefill with KV pool, Decode, and Omni Proxy (mtp3|mtp7 via mtp_variant)
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer/ai-infra-infer-1.2.1-arm-openeuler-py311-a3-cann9.1.0-pta_v2.12.0-ai-infra-op_1.7.0-omni_master-vllm-202610272325:0.0.1"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    DOCKER_NAME_M: "docker_name_m"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-505b
    # mtp3 | mtp7；可用环境变量 MTP_VARIANT 或 -e mtp_variant=...
    mtp_variant: "{{ lookup('env', 'MTP_VARIANT') | default('mtp7', true) }}"
    mtp_profiles:
      mtp3:
        model_path: "/mnt/sfs_turbo_new/bucket-910c-6055/s30033981/models/505B_iter_0015398_llt_modelslim_w4a8"
        num_speculative_tokens: 3
        enable_mdrv2: false
        rejection_sample_method: standard
        draft_sample_method: probabilistic
        compilation_config:
          mode: 3
          cudagraph_mode: FULL
          cudagraph_capture_sizes: [4, 16, 32]
          backend: ""
          compile_sizes: [4, 16, 32]
        decode_max_num_batched_tokens: 32
      mtp7:
        model_path: "/mnt/sfs_turbo_new/bucket-910c-6055/s30033981/models/505B_B003_mtp7/iter_0000900/modelslim_w4a8_schemal1_2"
        num_speculative_tokens: 7
        enable_mdrv2: true  # MDRv2 仅适配 mtp7
        rejection_sample_method: block
        draft_sample_method: probabilistic
        compilation_config:
          mode: 3
          cudagraph_mode: FULL
          cudagraph_capture_sizes: [8, 32, 64]
          backend: ""
          compile_sizes: [8, 32, 64]
        decode_max_num_batched_tokens: 64
    model_path: "{{ mtp_profiles[mtp_variant].model_path }}"
    num_speculative_tokens: "{{ mtp_profiles[mtp_variant].num_speculative_tokens }}"
    rejection_sample_method: "{{ mtp_profiles[mtp_variant].rejection_sample_method }}"
    draft_sample_method: "{{ mtp_profiles[mtp_variant].draft_sample_method }}"
    compilation_config: "{{ mtp_profiles[mtp_variant].compilation_config }}"
    decode_max_num_batched_tokens: "{{ mtp_profiles[mtp_variant].decode_max_num_batched_tokens }}"
    enable_mdrv2: "{{ mtp_profiles[mtp_variant].enable_mdrv2 }}"
    enable_prefix_caching: true

    # Selecting this dedicated playbook enables the M service and P-side pool.
    enable_fusion_pool: true
    fusion_pool_enable_load_events: false
    fusion_pool_enable_store_events: false

    # Requires the pool-aware Proxy and a Mooncake master built with ENABLE_KV_EVENTS.
    # These are the measured INT4 settings; override them for other workloads.
    omni_proxy_pool_aware: true
    omni_proxy_schedule_algo: work_aware
    omni_proxy_work_aware_short_threshold: 98304
    omni_proxy_work_aware_service_floor_tokens: 4096
    omni_proxy_pool_w_hbm: 100
    omni_proxy_pool_w_local: 90
    omni_proxy_pool_w_remote: 80
    mooncake_enable_kv_events: "{{ enable_fusion_pool | bool and omni_proxy_pool_aware | bool }}"

    run_docker_profile:
      shm_size: 1800g
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    # 镜像自带 omniinfer。KV pool 安装路径不在镜像里，只补 Pangu-Fusion。
    sync_code_profile:
      host_sync:
        enabled: false
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/" &&
          if [ -d '{{ ansible_env.CODE_PATH }}/Pangu-Fusion' ]; then
          docker exec "$DOCKER_NAME_P" rm -rf
          '{{ container_workspace }}/omniinfer/components/Pangu-Fusion' &&
          docker cp '{{ ansible_env.CODE_PATH }}/Pangu-Fusion'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/components/";
          fi
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/" &&
          if [ -d '{{ ansible_env.CODE_PATH }}/Pangu-Fusion' ]; then
          docker exec "$DOCKER_NAME_D" rm -rf
          '{{ container_workspace }}/omniinfer/components/Pangu-Fusion' &&
          docker cp '{{ ansible_env.CODE_PATH }}/Pangu-Fusion'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/components/";
          fi
        proxy: >-
          if [ -d '{{ ansible_env.CODE_PATH }}/Pangu-FusionComm' ]; then
          docker exec "$DOCKER_NAME_C" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_C" rm -rf
          '{{ container_workspace }}/omniinfer/components/omni-proxy' &&
          docker cp '{{ ansible_env.CODE_PATH }}/omni-proxy'
          "${DOCKER_NAME_C}:{{ container_workspace }}/omniinfer/components/";
          fi

    pip_install_profile:
      proxy: null

    run_server_prefill_profile:
      fusion_pool:
        global_segment_size_gb: 64
      prepare_commands: |-
        ## ========== [1/7] PD 通信 & 模型运行器（P侧） ==========
        export VLLM_USE_V2_MODEL_RUNNER={{ 1 if (enable_mdrv2 | bool) else 0 }}  # 仅 mtp7=1
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1

        ## ========== [2/7] HCCL 集合通信 ==========
        export HCCL_BUFFSIZE=100                     # 对应下方 --hccl-buffsize
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"           # 对应下方 --hccl-op-expansion-mode

        ## ========== [3/7] 调度 & 前后向数据流 ==========
        export TASK_QUEUE_ENABLE=2
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0

        ## ========== [4/7] KV pool / Mooncake 传输 ==========
        export OMNI_WORKER_CPUSET_MAP=auto            # cpu 绑核均衡 (kv pool / offload 通用)
        export ASCEND_CONNECT_TIMEOUT=180000          # Mooncake 连接超时 (ms)
        export ASCEND_TRANSFER_TIMEOUT=180000         # Mooncake 传输超时 (ms)

        ## ========== [5/7] 日志级别（默认全静默，排障开关集中在此） ==========
        export ASCEND_SLOG_PRINT_TO_STDOUT=0         # slog 打屏: 1开 / 0关
        export ASCEND_GLOBAL_LOG_LEVEL=3             # 0:DEBUG 1:INFO 2:WARNING 3:ERROR
        export ASCEND_GLOBAL_EVENT_ENABLE=0          # event 日志默认关闭
        # --- 排障时按需打开 ---
        # export HCCL_ENTRY_LOG_ENABLE=1              # HCCL 调用入口日志 -> plog
        # export VLLM_MOONCAKE_STORE_TIER_LOG=1       # "Mooncake load tier summary" 命中层级统计
        # export VLLM_SERVER_DEV_MODE=1               # sleep_wakeup / apc 清除
        # EXTRA_ARGS="${EXTRA_ARGS} --enable-log-outputs --enable-log-requests" # 抓请求输入输出(仅P侧调试)

        ## ========== [6/7] profiling + plog ==========
        mkdir -p ${LOG_PATH}/profiling
        # PROFILER_CONFIG='{"profiler":"torch","torch_profiler_dir":"'"${LOG_PATH}"'/profiling","ignore_frontend":true,"torch_profiler_with_stack":false}'
        # EXTRA_ARGS="${EXTRA_ARGS} --profiler-config ${PROFILER_CONFIG}"
        export ASCEND_PROCESS_LOG_PATH=${LOG_PATH}/plog   # plog 目录重定向
        rm -rf ${LOG_PATH}/plog/*

        ## ========== [7/7] vLLM 插件 & serve 参数 ==========
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export OMNI_VLLM_PATCHES_DIR="low_latency"

        # --- KV 事件上报 + KV cache 管理 ---
        ENDPOINT_PORT=$((API_PORT + 100))
        KV_EVENTS_CONFIG='{"enable_kv_cache_events":true,"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:'${ENDPOINT_PORT}'"}'
        EXTRA_ARGS="--kv-events-config ${KV_EVENTS_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --max-num-batched-tokens 49152"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 4"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        # --- 解析器 & reasoning ---
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"   # Iteration(...) 逐步调度日志(诊断用)
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        # --- prefix caching / APC ---
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --mamba-block-size 128 --enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_kv_offload.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_claw_noapc.json"
        {% endif %}
        # --- eplb（必须在 EXTRA_ARGS 初始化之后追加） ---
        EPLB_CONFIG='{"use_async":true,"communicator":"hixl","num_redundant_experts":0,"log_balancedness":false,"step_interval":100}'
        EXTRA_ARGS="${EXTRA_ARGS} --enable-eplb"
        EXTRA_ARGS="${EXTRA_ARGS} --eplb-config ${EPLB_CONFIG}"

        ## ========== 运行时资源 ==========
        export TORCH_COMPILE_DISABLE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        # w4a8 weights (~16 GiB/card at TP16): 0.9 leaves ample KV for
        # max-model-len 524288 (mirrors the espace reference playbook).
        GPU_UTIL=0.9
        {% if enable_fusion_pool | bool %}
        if [ -f "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh" ]; then
          . "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh"
        fi
        {% endif %}
      args:
        - >-
          {% if enable_fusion_pool | bool %}--kv-transfer-config "${KV_TRANSFER_CONFIG}"{% endif %}
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens {{ num_speculative_tokens }}

    run_server_decode_profile:
      fusion_pool:
        global_segment_size_gb: 64
        local_buffer_size_gb: 8
        hugepage_enabled: true
      prepare_commands: |-
        ## ========== [1] PD 通信 & 模型运行器（D侧） ==========
        export VLLM_USE_V2_MODEL_RUNNER={{ 1 if (enable_mdrv2 | bool) else 0 }}  # 仅 mtp7=1
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1
        ## ========== [2] HCCL 集合通信（D侧 buffer 更大 + AI_CPU 模式） ==========
        export HCCL_BUFFSIZE=1200                    # 对应下方 --hccl-buffsize
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        ## ========== [3] 调度 & 数据流（D侧） ==========
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100

        # 开发定位 + 日志使能
        export ASCEND_SLOG_PRINT_TO_STDOUT=0   # 日志打屏, 1打屏，0关闭
        export ASCEND_GLOBAL_LOG_LEVEL=3       # 日志级别常用 0:DEBUG 1:INFO; 3 ERROR级别
        export ASCEND_GLOBAL_EVENT_ENABLE=0    # 默认不使能event日志信息
        # export VLLM_MOONCAKE_STORE_TIER_LOG=1 # Fusion pool: "Mooncake load tier summary" kv 命中memory/disk 层级统计日志使能
        # export VLLM_SERVER_DEV_MODE=1
        # export HCCL_ENTRY_LOG_ENABLE=1

        ## profiling + plog 配置
        mkdir -p ${LOG_PATH}/profiling
        # PROFILER_CONFIG='{"profiler":"torch","torch_profiler_dir":"'"${LOG_PATH}"'/profiling","ignore_frontend":true,"torch_profiler_with_stack":false}'
        # EXTRA_ARGS="${EXTRA_ARGS} --profiler-config ${PROFILER_CONFIG}"
        export ASCEND_PROCESS_LOG_PATH=${LOG_PATH}/plog   # plog 目录重定向
        rm -rf ${LOG_PATH}/plog/*
        export VLLM_CACHE_ROOT='./graph_cache'

        ## ========== [4] vLLM 插件 & serve 参数 ==========
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export ENABLE_DP_LB=false
        export TASK_QUEUE_ENABLE=1
        export OMNI_VLLM_PATCHES_DIR="low_latency"
        # --- KV cache 管理 & EP ---
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 8"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens {{ decode_max_num_batched_tokens }}"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp --dtype bfloat16"
        COMPILATION_CONFIG={{ compilation_config | to_json | quote }}
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        # EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16 --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --mamba-block-size 128 --enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_claw.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_claw_noapc.json"
        {% endif %}
        ## ========== [5] 运行时资源（D侧开编译） ==========
        export TORCH_COMPILE_DISABLE=0
        export VLLM_DISABLE_COMPILE_CACHE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.90
        {% if enable_fusion_pool | bool %}
        if [ -f "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh" ]; then
          . "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh"
        fi
        {% endif %}
        # export OMNI_DRAFT_TOP_K=100 # 收益方向：probabilistic draft 下，草稿 token 的接受概率 ≈ min(1, p/q)。限制 draft top-k 让草稿集中在高概率 token 上，逐位接受率上升 → 平均接受长度变长 → 步数减少 → TPOT 改善。开销可忽略（每步一次小 tensor 替换）。
      args:
        - >-
          {% if enable_fusion_pool | bool %}--kv-transfer-config "${KV_TRANSFER_CONFIG}"{% endif %}
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": true}}'
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens {{ num_speculative_tokens }}
        - --rejection-sample-method {{ rejection_sample_method }}
        - --draft-sample-method {{ draft_sample_method }}

    run_server_common_profile:
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
        rm -f "${LOG_PATH}/{{ inventory_hostname }}/nginx_error_{{ ansible_date_time.iso8601_basic_short }}.log" \
              "${LOG_PATH}/{{ inventory_hostname }}/nginx_access_{{ ansible_date_time.iso8601_basic_short }}.log"
      args:
        - --omni-proxy-model-path {{ model_path | quote }}
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error_{{ ansible_date_time.iso8601_basic_short }}.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access_{{ ansible_date_time.iso8601_basic_short }}.log
        - --core-num 16
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 49152
        - --omni-proxy-prefill-max-num-seqs 4
        - --omni-proxy-decode-max-num-seqs 8
        - --omni-proxy-tokenizer-wide-affinity on
        - --omni-proxy-schedule-algo {{ omni_proxy_schedule_algo | quote }}
        - --omni-proxy-work-aware-short-threshold {{ omni_proxy_work_aware_short_threshold if omni_proxy_schedule_algo == 'work_aware' else 0 }}
        - --omni-proxy-work-aware-service-floor-tokens {{ omni_proxy_work_aware_service_floor_tokens if omni_proxy_schedule_algo == 'work_aware' else 0 }}
        - >-
          {% if enable_fusion_pool | bool and omni_proxy_pool_aware | bool %}
          --omni-proxy-pool-aware-scheduling on
          --omni-proxy-pool-master-events {{ ((hostvars[groups['M'][0]].host_ip | default(hostvars[groups['M'][0]].ansible_host)) ~ ':' ~ (hostvars[groups['M'][0]].mooncake_kv_events_port | default(5599))) | quote }}
          --omni-proxy-pool-master-admin {{ ((hostvars[groups['M'][0]].host_ip | default(hostvars[groups['M'][0]].ansible_host)) ~ ':' ~ ((hostvars[groups['M'][0]].mooncake_metadata_port | default(8081) | int) + 100)) | quote }}
          --omni-proxy-pool-w-hbm {{ omni_proxy_pool_w_hbm }}
          --omni-proxy-pool-w-local {{ omni_proxy_pool_w_local }}
          --omni-proxy-pool-w-remote {{ omni_proxy_pool_w_remote }}
          {% else %}
          --omni-proxy-pool-aware-scheduling off
          {% endif %}

  tasks:
    - name: Validate mtp_variant
      ansible.builtin.assert:
        that:
          - mtp_variant in mtp_profiles
          # MDRv2 只适配 mtp7：mtp3 必须 enable_mdrv2=false；mtp7 必须 true
          - (mtp_variant == 'mtp7' and (enable_mdrv2 | bool)) or (mtp_variant == 'mtp3' and not (enable_mdrv2 | bool))
        fail_msg: >-
          mtp_variant={{ mtp_variant | quote }} / enable_mdrv2={{ enable_mdrv2 | quote }} invalid.
          Use MTP_VARIANT=mtp3|mtp7 (or -e mtp_variant=...).
          Constraint: MDRv2 only for mtp7 (mtp3 must keep enable_mdrv2=false).
        success_msg: >-
          mtp_variant={{ mtp_variant }} enable_mdrv2={{ enable_mdrv2 }}
          model_path={{ model_path }}
          speculative={{ num_speculative_tokens }}
          rejection={{ rejection_sample_method }} draft={{ draft_sample_method }}
          compilation_config={{ compilation_config }}
      run_once: true

    - ansible.builtin.import_role:
        name: fusion_pool
