---
- name: Run Pangu 92B with OmniCache V2 Prefill, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: "{{ pangu_log_path }}"
    LOG_PATH_IN_EXECUTOR: "{{ pangu_executor_log_path }}"
    CODE_PATH: "{{ pangu_code_path }}"
    DOCKER_IMAGE_ID: "{{ pangu_container_image }}"
    DOCKER_NAME_P: "{{ pangu_prefill_container_name }}"
    DOCKER_NAME_D: "{{ pangu_decode_container_name }}"
    DOCKER_NAME_C: "{{ pangu_proxy_container_name }}"
    DOCKER_NAME_M: "docker_name_m"
    SCRIPTS_PATH: "{{ pangu_scripts_path }}"

    # Before running:
    # export ANSIBLE_ROLES_PATH=/data/xxx/pangu21/omniinfer/tools/deploy/ansible/roles

  vars:
    # Keep the OmniInfer Pangu deployment interface, while allowing the same
    # command-line -e overrides used by the DSV4 bootstrap/start workflow.
    pangu_code_path: /data/xxx/pangu21/
    pangu_container_image: "registry-cbu.huawei.com/omniai_omniinfer_dev/ai-infra-infer-1.0.3-a3-arm-feature/vllm_0.25.1-202608211426-daily:0.0.2"
    pangu_prefill_container_name: "xxx_p"
    pangu_decode_container_name: "xxx_d"
    pangu_proxy_container_name: "xxx_c"
    pangu_log_path: /data/xxx/pangu21/logs_path/logs
    pangu_executor_log_path: /data/xxx/pangu21/logs_path/log_path_in_executor
    pangu_scripts_path: /data/xxx/pangu21/logs_path/scripts_path

    model: pangu-v2-92b
    # model_path: "/mnt/sfs_turbo/bucket-910c-6055/zhuqi/ckpt/pangu92b/0620_v21_new/output_ckpts/hf/global_step_26-iterative-int8-0626"
    model_path: "/mnt/sfs_turbo_new/bucket-910c-6055/s00562949/models/openPangu_2.0_Flash_INT8/global_step_26-iterative-int8-0626"

    # Keep the D-side local OX ports distinct because this inventory runs P and
    # D containers on one host with --net=host. Only P binds the completion port.
    omnicache_v2_prefill_kv_transfer_config:
      kv_connector: OmniCacheConnector
      kv_connector_module_path: omni_cache.v2.vllm_adapter.connector.connector
      kv_role: kv_producer
      kv_port: "30000"
      kv_connector_extra_config:
        # cpu_bytes_to_use: 644245094400
        cpu_bytes_to_use: 1288490188800
        enable_volatile_single_layer_hbm: true
        host_memory_pool_path: /dev/hugepages/omni_cache_p
        # prefix_match_diagnostics: true
        ox_listen_endpoints: "16077"
        ox_advertised_endpoints: "{{ host_ip }}:16077"
        ox_endpoint: tcp://127.0.0.1:17555
        ox_control_bind_endpoint: tcp://*:17555
        pd_completion_enabled: true
        pd_completion_port: 5568
    omnicache_v2_decode_kv_transfer_config:
      kv_connector: OmniCacheConnector
      kv_connector_module_path: omni_cache.v2.vllm_adapter.connector.connector
      kv_role: kv_consumer
      kv_port: "30400"
      kv_connector_extra_config:
        cpu_bytes_to_use: 644245094400
        enable_volatile_single_layer_hbm: false
        host_memory_pool_path: /dev/hugepages/omni_cache_d
        ox_listen_endpoints: >-
          {{ omnicache_v2_decode_ox_listen_endpoints_override | default('16078') }}
        ox_endpoint: >-
          {{ omnicache_v2_decode_ox_endpoint_override | default('tcp://127.0.0.1:17556') }}
        ox_control_bind_endpoint: >-
          {{ omnicache_v2_decode_ox_control_bind_endpoint_override | default('tcp://*:17556') }}
        pd_completion_enabled: true
        pd_completion_port: 5568
        host_memory_node_dp_rank_start: 0
        host_memory_node_dp_size: 16

    run_docker_profile:
      shm_size: 1600g
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home
        - /dev/hugepages:/dev/hugepages

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/" &&
          docker exec "$DOCKER_NAME_P" rm -rf
          '{{ container_workspace }}/omni-cache' &&
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omni-cache' &&
          docker cp '{{ ansible_env.CODE_PATH }}/omni-cache/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omni-cache/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/" &&
          docker exec "$DOCKER_NAME_D" rm -rf
          '{{ container_workspace }}/omni-cache' &&
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omni-cache' &&
          docker cp '{{ ansible_env.CODE_PATH }}/omni-cache/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omni-cache/"

    pip_install_profile:
      prefill: >-
        docker exec "$DOCKER_NAME_P" bash -lc
        'source ~/.bashrc &&
        python -m pip uninstall -y omni-npu omni-cache &&
        TORCH_DEVICE_BACKEND_AUTOLOAD=0
        python -m pip install --force-reinstall
        --no-deps --no-build-isolation --editable
        {{ container_workspace }}/omniinfer &&
        TORCH_DEVICE_BACKEND_AUTOLOAD=0
        python -m pip install --force-reinstall
        --no-deps --no-build-isolation --editable
        {{ container_workspace }}/omni-cache'
      decode: >-
        docker exec "$DOCKER_NAME_D" bash -lc
        'source ~/.bashrc &&
        python -m pip uninstall -y omni-npu omni-cache &&
        TORCH_DEVICE_BACKEND_AUTOLOAD=0
        python -m pip install --force-reinstall
        --no-deps --no-build-isolation --editable
        {{ container_workspace }}/omniinfer &&
        TORCH_DEVICE_BACKEND_AUTOLOAD=0
        python -m pip install --force-reinstall
        --no-deps --no-build-isolation --editable
        {{ container_workspace }}/omni-cache'

    run_server_prefill_profile:
      # Keep OmniInfer's built-in KV offload disabled; OmniCache V2 owns the
      # Host tier through the standard KV connector configured below.
      kv_offload:
        enable: false
        hugepage_enabled: true
        cpu_bytes_to_use: 858993459200
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=3600
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=100
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models,omni_cache_v2_volatile_layout"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export OMNI_ENABLE_OMNI_CACHE=1
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_p_omnicache_open.json"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export TORCH_COMPILE_DISABLE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export HCCL_SOCKET_IFNAME=enp23s0f3
        export OMNI_CACHE_V2_ASYNC_PRODUCER=1
        # export OMNI_CACHE_V2_DIAGNOSTICS=3
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-batched-tokens 65536"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 3"
        EXTRA_ARGS="${EXTRA_ARGS} --mamba-block-size 128 --enable-prefix-caching --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16"
        EXTRA_ARGS="${EXTRA_ARGS} --lopt-chunk-size 4096"
        # EXTRA_ARGS="${EXTRA_ARGS} --no-async-scheduling"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
      args:
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - '--additional-config ''{"enable_low_latency": true, "enable_omni_cache": true}'''
        - --gpu-util 0.76
        - >-
          --kv-transfer-config '{{
          (omnicache_v2_prefill_kv_transfer_config
          | combine({'engine_id': kv_rank | string})) | to_json }}'
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_decode_profile:
      kv_offload:
        enable: false
        hugepage_enabled: true
        cpu_bytes_to_use: 53687091200
      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=300
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1200
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_EXEC_TIMEOUT=1800
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_SKIP_DECODE_TOKENIZE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models,omni_cache_v2_volatile_layout"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=17
        export OMNI_VLLM_PATCHES_DIR="pangu_v2_hybrid, pangu_v2_moe"
        export OMNI_VLLM_PATCHES="ALL"
        export ENABLE_DP_LB=false
        export OMNI_ENABLE_OMNI_CACHE=1
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_92B_xp1d_d_open.json"
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_DISABLE_COMPILE_CACHE=1
        export TORCH_COMPILE_DISABLE=0
        export VLLM_CACHE_ROOT='./graph_cache'
        export TASK_QUEUE_ENABLE=1
        export HCCL_SOCKET_IFNAME=enp23s0f3
        # export OMNI_CACHE_V2_DIAGNOSTICS=3
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        rm -rf {{ container_workspace }}/omniinfer/tools/deploy/start_server/static_kernel_compile_outputs
        rm -rf /usr/local/Ascend/cann/opp/static_kernel
        rm -rf /usr/local/Ascend/cann-9.1.0-beta.1/opp/static_kernel
        rm -rf graph_cache/
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 4"
        EXTRA_ARGS="${EXTRA_ARGS} --mamba-block-size 128 --enable-prefix-caching --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[16], "backend":"", "compile_sizes":[16]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16"
        EXTRA_ARGS="${EXTRA_ARGS} --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
      args:
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "enable_omni_cache": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": false}}'
        - --gpu-util 0.82
        - >-
          --kv-transfer-config '{{
          (omnicache_v2_decode_kv_transfer_config
          | combine({'engine_id': groups['P'] | length | string})) | to_json }}'
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 3

    run_server_common_profile:
      single_node_prefill_wait_seconds: 5
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 100000
        - --omni-proxy-prefill-max-num-seqs 12
        - --omni-proxy-decode-max-num-seqs 4

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
