all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o IdentitiesOnly=yes'
    ansible_ssh_private_key_file: /root/.ssh/id_ed25519
    global_port_base: 8000
    base_api_port: 9000
    proxy_port: 7300
    port_offset:
      P: 0      # P 组实际端口区间: 8000-8099
      D: 100    # D 组实际端口区间: 8100-8199

  children:
    P:
      hosts:
        p0:
          ansible_host: "127.0.0.1"
          node_rank: 0
          kv_rank: 0
          node_port: "{{ global_port_base + port_offset.P + kv_rank }}"
          api_port: "{{ base_api_port + port_offset.P + kv_rank }}"
          host_ip: "127.0.0.1"
          ascend_rt_visible_devices: "0,1,2,3"

    D:
      hosts:
        d0:
          ansible_host: "127.0.0.1"
          node_rank: 0
          node_port: "{{ global_port_base + port_offset.D }}"
          api_port: "{{ base_api_port + port_offset.D + node_rank }}"
          host_ip: "127.0.0.1"
          ascend_rt_visible_devices: "4,5,6,7"

    C:
      hosts:
        c0:
          ansible_host: "127.0.0.1"
          node_rank: 0
          node_port: "{{ proxy_port + node_rank }}"
          role: "C"