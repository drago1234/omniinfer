---
- name: Run PanguV2 505B INT8 3P1D Prefill with KV offload, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  # 当前 Ansible 的配置与使用说明请参见 tools/deploy/ansible/README.md。
  # 搭配 inventories/omni_infer_inventory_used_for_4P8_1D16.yml 拓扑模板使用。
  environment:
    LOG_PATH: "{{ rsi_log_path }}"
    LOG_PATH_IN_EXECUTOR: "{{ rsi_executor_log_path }}"
    CODE_PATH: "{{ rsi_remote_code_path }}"
    CODE_PATH_IN_EXECUTOR: "{{ rsi_executor_code_path }}"
    DOCKER_IMAGE_ID: "{{ rsi_docker_image }}"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    DOCKER_NAME_M: "docker_name_m"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-505b
    model_path: "{{ rsi_model_path }}"
    enable_prefix_caching: true
    enable_fusion_pool: true
    rsi_pool_manifest_sha256: "6d27363885ec7bd29d54e8aa6434d3ee1daeb7454867caa2eb093d68a517e91d"
    fusion_pool_repo_root: "{{ playbook_dir }}/assets"
    fusion_pool_enable_load_events: false
    fusion_pool_enable_store_events: false

    run_docker_profile:
      # Keep the /dev/shm fallback large enough for the 1 TiB Prefill pool
      # when Prefill kv_offload.hugepage_enabled is turned off.
      shm_size: 1800g
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    # host_sync 同步整个 omniinfer 和 vllm/vllm。
    # 容器里覆盖 omni、start_server、vllm/vllm 和本部署包的 Pool 依赖。
    sync_code_profile:
      host_sync:
        enabled: true
        source: "{{ ansible_env.CODE_PATH_IN_EXECUTOR }}/"
        destination: "{{ ansible_env.CODE_PATH }}/"
        delete: true
        rsync_opts:
          - "--include=/omniinfer/"
          - "--include=/omniinfer/***"
          - "--include=/vllm/"
          - "--include=/vllm/vllm/"
          - "--include=/vllm/vllm/***"
          - "--exclude=/vllm/*"
          - "--exclude=*"

      container_copy:
        prefill: >-
          (cd '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/ansible/rsi_505b_3p1d_pool/assets/Pangu-FusionPool' &&
          printf '%s  %s\n' '{{ rsi_pool_manifest_sha256 }}' SHA256SUMS | sha256sum -c - &&
          sha256sum -c SHA256SUMS &&
          diff -u <(awk '/[.]py$/ {print $2}' SHA256SUMS | sort) <(find fusion_pool kv_common -type f -name '*.py' | sort)) &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer/omni/' -type f
          '(' -name '*.py' -o -name '*.pyc' ')' -delete &&
          docker exec "$DOCKER_NAME_P" find /opt/vllm/vllm -type f
          '(' -name '*.py' -o -name '*.pyc' ')'
          ! -path /opt/vllm/vllm/_version.py -delete &&
          docker exec "$DOCKER_NAME_P" rm -rf
          '{{ container_workspace }}/omniinfer/tools/deploy/start_server' &&
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" rm -rf
          '{{ container_workspace }}/omniinfer/components/rsi-fusion-pool' &&
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components/rsi-fusion-pool' &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/omni/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/omni/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/vllm/vllm/.'
          "${DOCKER_NAME_P}:/opt/vllm/vllm/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/start_server'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/tools/deploy/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/ansible/rsi_505b_3p1d_pool/assets/Pangu-FusionPool/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/components/rsi-fusion-pool/" &&
          docker exec "$DOCKER_NAME_P" bash -c
          'cd "{{ container_workspace }}/omniinfer/components/rsi-fusion-pool" && sha256sum -c SHA256SUMS'
        decode: >-
          (cd '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/ansible/rsi_505b_3p1d_pool/assets/Pangu-FusionPool' &&
          printf '%s  %s\n' '{{ rsi_pool_manifest_sha256 }}' SHA256SUMS | sha256sum -c - &&
          sha256sum -c SHA256SUMS &&
          diff -u <(awk '/[.]py$/ {print $2}' SHA256SUMS | sort) <(find fusion_pool kv_common -type f -name '*.py' | sort)) &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer/omni/' -type f
          '(' -name '*.py' -o -name '*.pyc' ')' -delete &&
          docker exec "$DOCKER_NAME_D" find /opt/vllm/vllm -type f
          '(' -name '*.py' -o -name '*.pyc' ')'
          ! -path /opt/vllm/vllm/_version.py -delete &&
          docker exec "$DOCKER_NAME_D" rm -rf
          '{{ container_workspace }}/omniinfer/tools/deploy/start_server' &&
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" rm -rf
          '{{ container_workspace }}/omniinfer/components/rsi-fusion-pool' &&
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components/rsi-fusion-pool' &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/omni/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/omni/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/vllm/vllm/.'
          "${DOCKER_NAME_D}:/opt/vllm/vllm/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/start_server'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/tools/deploy/" &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/tools/deploy/ansible/rsi_505b_3p1d_pool/assets/Pangu-FusionPool/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/components/rsi-fusion-pool/" &&
          docker exec "$DOCKER_NAME_D" bash -c
          'cd "{{ container_workspace }}/omniinfer/components/rsi-fusion-pool" && sha256sum -c SHA256SUMS'

    run_server_prefill_profile:
      # Each Prefill enables a 1 TiB CPU offload pool in this 3P1D scenario.
      fusion_pool:
        global_segment_size_gb: 4
        local_buffer_size_gb: 1
        hugepage_enabled: false
      kv_offload:
        enable: false
        hugepage_enabled: true
        cpu_bytes_to_use: 1099511627776  # 1 TiB
        eviction_policy: arc  # arc or lru
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=100
        export HCCL_CONNECT_TIMEOUT=120
        export HCCL_EXEC_TIMEOUT=120
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export OMNI_VLLM_PATCHES_DIR="low_latency"
        ENDPOINT_PORT=$((API_PORT + 100))
        KV_EVENTS_CONFIG='{"enable_kv_cache_events":true,"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:'${ENDPOINT_PORT}'"}'
        EXTRA_ARGS="--kv-events-config ${KV_EVENTS_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --max-num-batched-tokens 49152"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 4"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_kv_offload.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_claw_noapc.json"
        {% endif %}
        export TORCH_COMPILE_DISABLE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.88
        . "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh"
      args:
        - --kv-transfer-config "${KV_TRANSFER_CONFIG}"
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 7

    run_server_decode_profile:
      # Decode keeps the plain LLMDataDist connector; flipping enable to true
      # activates the configured per-device 50 GiB CPU offload pool.
      fusion_pool:
        global_segment_size_gb: 4
        local_buffer_size_gb: 1
        hugepage_enabled: false
      kv_offload:
        enable: false
        hugepage_enabled: false
        cpu_bytes_to_use: 53687091200  # 50 GiB
        eviction_policy: arc  # arc or lru
      prepare_commands: |-
        export OMNI_FAKE_ACLGRAPH=0
        # export OMNI_KV_DUMP_PATH=/data/x00620016/workspace/dump_kv
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1200
        export HCCL_CONNECT_TIMEOUT=120
        export HCCL_EXEC_TIMEOUT=120
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export ENABLE_DP_LB=false
        export TASK_QUEUE_ENABLE=1
        export LOCAL_WORLD_SIZE=16
        export OMNI_VLLM_PATCHES_DIR="low_latency"
        EXTRA_ARGS="--no-disable-hybrid-kv-cache-manager"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 3 --max-num-batched-tokens 24"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp --dtype bfloat16"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[24], "backend":"", "compile_sizes":[24]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_claw.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_claw_noapc.json"
        {% endif %}
        export TORCH_COMPILE_DISABLE=0
        export VLLM_DISABLE_COMPILE_CACHE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.95
        . "{{ ansible_env.SCRIPTS_PATH }}/fusion_pool_runtime.sh"
      args:
        - --kv-transfer-config "${KV_TRANSFER_CONFIG}"
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": false}}'
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 7
        - --rejection-sample-method standard
        - --draft-sample-method probabilistic

    run_server_common_profile:
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
        rm -f "${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log" \
              "${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log"
      args:
        - --omni-proxy-model-path {{ model_path | quote }}
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 16
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 20480
        - --omni-proxy-prefill-max-num-seqs 3
        - --omni-proxy-decode-max-num-seqs 3

    proc_bind_profile:
      enabled: "{{ proc_bind_enabled | default(false) | bool }}"

  tasks:
    - ansible.builtin.import_role:
        name: fusion_pool_rsi
