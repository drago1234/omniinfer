---
- name: Run PanguV2 505B INT8 3P1D Prefill, Decode, and Omni Proxy services.
  hosts: all
  any_errors_fatal: true
  max_fail_percentage: 0
  gather_facts: true
  environment:
    LOG_PATH: /data/log_path
    LOG_PATH_IN_EXECUTOR: /data/log_path_in_executor
    CODE_PATH: /data/local_code_path
    DOCKER_IMAGE_ID: "registry-cbu.huawei.com/omniai_omniinfer/ai-infra-infer-1.2.1-arm-openeuler-py311-a3-cann9.1.0-pta_v2.12.0-ai-infra-op_1.5.0-omni_master-vllm-202609180014:0.0.1"
    DOCKER_NAME_P: "docker_name_p"
    DOCKER_NAME_D: "docker_name_d"
    DOCKER_NAME_C: "docker_name_c"
    SCRIPTS_PATH: /tmp/scripts_path

  vars:
    model: pangu-v2-505b
    # model_path: "/mnt/sfs_turbo/bucket-910c-6055/rk/ckpt/505B_B005_INT8_open_index_shared"
    model_path: "/mnt/sfs_turbo/bucket-pangu-green-guiyang/h00988481/505B_w4a8_mtp7/modelslim_w4a8_schemal1_2/"
    enable_prefix_caching: true


    run_docker_profile:
      envs:
        - PYTHONHASHSEED=1234
      extra_mounts:
        - /mnt:/mnt
        - /tmp:/tmp
        - /home:/home

    sync_code_profile:
      container_copy:
        prefill: >-
          docker exec "$DOCKER_NAME_P" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_P" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_P}:{{ container_workspace }}/omniinfer/"
        decode: >-
          docker exec "$DOCKER_NAME_D" mkdir -p
          '{{ container_workspace }}/omniinfer/components' &&
          docker exec "$DOCKER_NAME_D" find
          '{{ container_workspace }}/omniinfer'
          -mindepth 1 -maxdepth 1 ! -name components
          -exec rm -rf -- '{}' + &&
          docker cp '{{ ansible_env.CODE_PATH }}/omniinfer/.'
          "${DOCKER_NAME_D}:{{ container_workspace }}/omniinfer/"

    pip_install_profile:
      prefill: >-
        docker exec "$DOCKER_NAME_P" bash -lc
        'set -euo pipefail;'

      decode: >-
        docker exec "$DOCKER_NAME_D" bash -lc
        'set -euo pipefail;'

    run_server_prefill_profile:
      kv_offload:
        enable: true
        hugepage_enabled: true
        cpu_bytes_to_use: 1099511627776  # 1 TiB
        # 分片 DDR 载入：每卡只从 DDR 读 1/tp，卡间 all-gather 拼齐；不满足条件时各卡一致退回原路径。
        # 特性默认关，这里只是把开关摆出来；要开改成 true。
        sharded_load: false
      prepare_commands: |-
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_ALL | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=100
        export HCCL_CONNECT_TIMEOUT=1800
        export VLLM_SERVER_DEV_MODE=1
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AIV"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        export TASK_QUEUE_ENABLE=2
        # export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0
        # export TORCH_COMPILE_DISABLE=1
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export OMNI_VLLM_PATCHES_DIR="low_latency"
        # export VLLM_TORCH_PROFILER_DIR=${LOG_PATH}/{{ inventory_hostname }}/profiling
        # mkdir -p "${VLLM_TORCH_PROFILER_DIR}"
        # export OMNI_PROFILE_TOKEN_THRESHOLD=100
        # export OMNI_ENABLE_PREFILL_PROFILER=true
        # export OMNI_PROFILE_STOP_STEP=3
        # export OMNI_PROFILE_SKIP_REQUESTS=3
        # EXTRA_ARGS="--profiler-config.profiler=torch --profiler-config.torch_profiler_dir ${VLLM_TORCH_PROFILER_DIR}"
        # EXTRA_ARGS="${EXTRA_ARGS} --profiler-config.torch_profiler_with_stack false"
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --max-num-batched-tokens 65536"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-expert-parallel --max-num-seqs 8"
        EPLB_CONFIG='{"use_async":true,"communicator":"hixl","num_redundant_experts":0,"log_balancedness":false,"step_interval":100}'
        EXTRA_ARGS="${EXTRA_ARGS} --enable-eplb"
        EXTRA_ARGS="${EXTRA_ARGS} --eplb-config ${EPLB_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --dtype bfloat16 --enforce-eager"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16 --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_codeagent.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_p_codeagent.json"
        {% endif %}

        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.9
      args:
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - '--additional-config ''{"enable_low_latency": true}'''
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 7

    run_server_decode_profile:
      prepare_commands: |-
        export DECODE_DATA_PARALLEL_SIZE={{ DECODE_SERVER_BY_GROUP | quote }}
        export SERVER_IP_LIST={{ DECODE_SERVER_IP_LIST_BY_GROUP | replace(' ', '') | trim | quote }}
        export OMNI_LLMDATADIST_LINK_RECYCLE_DELAY=36000
        export VLLM_DISABLE_PYNCCL=1
        export HCCL_BUFFSIZE=1200
        export HCCL_CONNECT_TIMEOUT=1800
        export HCCL_EXEC_TIMEOUT=1800
        export HCCL_OP_RETRY_ENABLE="L0:0,L1:0,L2:0"
        export HCCL_OP_EXPANSION_MODE="AI_CPU"
        export ASCEND_GLOBAL_LOG_LEVEL=3
        # export OMNI_REUSE_PREFILLED_TOKENS=1
        export OMNI_PIGGYBACK_INPUT_IDS=1
        export OMNI_SKIP_DECODE_TOKENIZE=0
        export VLLM_MQ_MAX_CHUNK_BYTES_MB=100
        export OMNI_PANGU_TOOL_CALL_ENDS_THINKING=1
        export VLLM_PLUGINS="omni-npu,omni_npu_patches,omni_custom_models"
        export OMNI_HYBRID_ATTN_GROUP_SIZE=18
        export OMNI_VLLM_PATCHES_DIR="low_latency"
        export ENABLE_DP_LB=false
        export TASK_QUEUE_ENABLE=1
        export LOCAL_WORLD_SIZE=16
        # export VLLM_TORCH_PROFILER_DIR=${LOG_PATH}/{{ inventory_hostname }}/profiling
        # mkdir -p "${VLLM_TORCH_PROFILER_DIR}"
        # export OMNI_PROFILE_TOKEN_THRESHOLD=1
        # export OMNI_ENABLE_PREFILL_PROFILER=true
        # export OMNI_PROFILE_STOP_STEP=4
        # export OMNI_PROFILE_SKIP_REQUESTS=2
        # EXTRA_ARGS="--profiler-config.profiler=torch --profiler-config.torch_profiler_dir ${VLLM_TORCH_PROFILER_DIR}"
        # EXTRA_ARGS="${EXTRA_ARGS} --profiler-config.torch_profiler_with_stack false"
        EXTRA_ARGS="${EXTRA_ARGS} --no-disable-hybrid-kv-cache-manager --enable-expert-parallel"
        EXTRA_ARGS="${EXTRA_ARGS} --max-num-seqs 16"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prompt-tokens-details --enable-chunked-prefill"
        EXTRA_ARGS="${EXTRA_ARGS} --distributed-executor-backend mp --dtype bfloat16"
        COMPILATION_CONFIG='{"mode": 3, "cudagraph_mode":"FULL", "cudagraph_capture_sizes":[128], "backend":"", "compile_sizes":[128]}'
        EXTRA_ARGS="${EXTRA_ARGS} --compilation-config ${COMPILATION_CONFIG}"
        EXTRA_ARGS="${EXTRA_ARGS} --kv-cache-dtype li_int8_ds_mla"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-logging-iteration-details"
        # EXTRA_ARGS="${EXTRA_ARGS} --no-async-scheduling"
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-parser pangu --enable-auto-tool-choice --tool-call-parser pangu"
        EXTRA_ARGS="${EXTRA_ARGS} --enable-lopt --lopt-pool-size 16 --lopt-chunk-size 4096"
        REASONING_CONFIG='{"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        EXTRA_ARGS="${EXTRA_ARGS} --reasoning-config ${REASONING_CONFIG}"
        {% if enable_prefix_caching | bool %}
        EXTRA_ARGS="${EXTRA_ARGS} --enable-prefix-caching --mamba-block-size 128"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_codeagent.json"
        {% else %}
        EXTRA_ARGS="${EXTRA_ARGS} --no-enable-prefix-caching"
        export OMNI_CUSTOM_MODEL_CONFIG_PATH="low_latency/openpangu_v2/pangu_v2_moe_bf16_a3_505B_xp1d_d_codeagent.json"
        {% endif %}
        # export TORCH_COMPILE_DISABLE=1
        export VLLM_DISABLE_COMPILE_CACHE=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        GPU_UTIL=0.9
      args:
        - --max-model-len 524288
        - --served-model-name {{ model | quote }}
        - --tp 1
        - >-
          --additional-config
          '{"enable_low_latency": true,
          "npugraph_ex_config":{"enable": true,
          "super_kernel_optimize": false,
          "static_kernel_compile": true}}'
        - --gpu-util "${GPU_UTIL}"
        - --extra-args "${EXTRA_ARGS}"
        - --hccl-buffsize "${HCCL_BUFFSIZE}"
        - --hccl-op-expansion-mode "${HCCL_OP_EXPANSION_MODE}"
        - --num-speculative-tokens 7
        - --rejection-sample-method standard
        - --draft-sample-method probabilistic

    run_server_common_profile:
      restart_proxy: true

    run_proxy_profile:
      prepare_commands: |-
        export PYTHONHASHSEED=1234
        export TORCH_DEVICE_BACKEND_AUTOLOAD=0
      args:
        - --log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_error.log
        - --log-level info
        - --access-log-file ${LOG_PATH}/{{ inventory_hostname }}/nginx_access.log
        - --core-num 4
        - --start-core-index 16
        - --subrequest-output-buffer-size 10M
        - --omni-proxy-pd-policy sequential
        - --omni-proxy-max-batch-num-token 65536
        - --omni-proxy-prefill-max-num-seqs 8
        - --omni-proxy-decode-max-num-seqs 16

  tasks:
    - ansible.builtin.import_role:
        name: elastic_server
