all:
  children:
    C:
      hosts:
        c0:
          DOCKER_IMAGE_ID: registry-cbu.huawei.com/omniai_omniinfer/omniinfer-a2-arm:release_0.7.5-202608011850-vllm
          ansible_host: 127.0.0.1
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
          ansible_ssh_private_key_file: /path/to/key
          ansible_user: root
          ascend_rt_visible_devices: 0,1,2,3,4,5,6,7
          container_name: glm52_p_only_p0
          use_omni_proxy: 1
          env:
            API_PORT: 7200
            CODE_PATH: /workspace/omniinfer
            LOG_PATH: /tmp/logs
            ROLE: proxy
            MODEL_PATH: /sfs-asset-inference-ci/model/GLM-5.2-w4a8c16
            ACCESS_LOG_FILE: ${LOG_PATH}/nginx/nginx_access.log
            OMNI_PROXY_PD_POLICY: sequential
            OMNI_PROXY_MAX_BATCH_NUM_TOKEN: 400000
            OMNI_PROXY_PREFILL_MAX_NUM_SEQS: 16
            OMNI_PROXY_DECODE_MAX_NUM_SEQS: 4
            PYTHONHASHSEED: 123
    P:
      hosts:
        p0:
          DOCKER_IMAGE_ID: registry-cbu.huawei.com/omniai_omniinfer/omniinfer-a2-arm:release_0.7.5-202608011850-vllm
          ansible_host: 127.0.0.1
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
          ansible_ssh_private_key_file: /path/to/key
          ansible_user: root
          args:
            base-api-port: $API_PORT
            enable-mtp: ''
            extra-args:
              disable-log-requests: ''
              enable-expert-parallel: ''
              enforce-eager: ''
              num-gpu-blocks-override: 210000
              max-num-batched-tokens: 81920
              max-num-seqs: 8
              long-prefill-token-threshold: 32768
              speculative-config: '{"method":"deepseek_mtp","num_speculative_tokens":3}'
              reasoning-parser: GlmMoe
              chat-template: ${MODEL_PATH}/chat_template.jinja
              enable-auto-tool-choice: ''
              tool-call-parser: GlmMoe
              tool-parser-plugin: /workspace/omniinfer/omni/adaptors/vllm/entrypoints/openai/tool_parsers/glm4_moe_tool_parser.py
            gpu-util: '0.93'
            kv-transfer-config:
              engine_id: 0
              kv_buffer_device: npu
              kv_connector: AscendHcclConnectorV1
              kv_parallel_size: 1
              kv_rank: $KV_RANK
              kv_role: kv_producer
            log-dir: $LOG_PATH
            master-ip: $HOST_IP
            master-port: $MASTER_PORT
            max-model-len: $MODEL_LEN_MAX_PREFILL
            model-path: $MODEL_PATH
            num-dp: 1
            num-servers: 1
            served-model-name: glmmoedsa
            server-offset: $SERVER_OFFSET
            tp: 32
          ascend_rt_visible_devices: 0,1,2,3,4,5,6,7
          container_name: glm52_p_only_p0
          env:
            OMNI_DISABLE_NPU_TOP_K_TOP_P_SAMPLE: 1
            API_PORT: 9000
            ASCEND_GLOBAL_LOG_LEVEL: 3
            HCCL_OP_EXPANSION_MODE: AIV
            ASCEND_PLATFORM: A2
            ASCEND_AICPU_PATH: /usr/local/Ascend/latest
            ASCEND_HOME_PATH: /usr/local/Ascend/latest
            ASCEND_LAUNCH_BLOCKING: '0'
            ASCEND_OPP_PATH: /usr/local/Ascend/latest/opp
            ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
            ASCEND_TOOLKIT_HOME: /usr/local/Ascend/latest
            AUTO_USE_UC_MEMORY: 1
            CODE_PATH: /workspace/omniinfer
            DECODE_POD_NUM: 0
            # GLOBAL_RANK_TABLE_FILE_PATH: ${RANKTABLE_SAVE_PATH}/global/global_ranktable_merge.json
            GLOO_SOCKET_IFNAME: enp67s0f5
            HCCL_BUFFSIZE: 50
            HCCL_SOCKET_IFNAME: enp67s0f5
            HCCL_CONNECT_TIMEOUT: 1800
            HCCL_EXEC_TIMEOUT: 1800
            HCCL_INTRA_PCIE_ENABLE: 0
            HCCL_INTRA_ROCE_ENABLE: 1
            HOST_IP: 127.0.0.1
            LOCAL_HOST_IP: 127.0.0.1
            KV_RANK: 0
            LCCL_DETERMINISTIC: 0
            LCCL_PARALLEL: 0
            LOG_PATH: /tmp/logs
            MASTER_PORT: 8000
            MODEL_LEN_MAX_PREFILL: 524288
            MODEL_PATH: /sfs-asset-inference-ci/model/GLM-5.2-w4a8c16
            OMNI_USE_DSV3: 1
            PREFILL_POD_NUM: 1
            PREFILL_SERVER_LIST: 0,1,2,3,4,5,6,7
            PREFILL_TENSOR_PARALLEL_SIZE: 32
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            RANKTABLE_SAVE_PATH: /tmp/p_only_p0_ranktable
            # RANK_TABLE_FILE_PATH: $(ls ${RANKTABLE_SAVE_PATH}/global/collect_files_p/127.0.0.1/local_*merge.json)
            ROLE: prefill
            SERVER_OFFSET: 0
            SHLVL: 1
            SOCKET_IFNAME: enp67s0f5
            TASK_QUEUE_ENABLE: 2
            TNG_HOST_COPY: 1
            TOOLCHAIN_HOME: /usr/local/Ascend/latest/toolkit
            TP_SOCKET_IFNAME: enp67s0f5
            USING_LCCL_COM: 0
            VLLM_ENABLE_MC2: 1
            VLLM_LLMDATADIST_ZMQ_PORT: 5568
            VLLM_LOGGING_LEVEL: INFO
            VLLM_USE_V1: 1
            VLLM_WORKER_MULTIPROC_METHOD: fork
            ENABLE_OMNI_CACHE: 1
            P_NODE_PORT_LIST: 127.0.0.1,127.0.0.2,127.0.0.3,127.0.0.4
            TP_NNODES: 4
            DEVICE_CACHE_SCALE_RATIO: 2
            MAP_SIZE_BYTES: 773094113280
            SIZE_BYTES_PER_LAYER: 9663676416
            OMNI_CACHE_SAFETY_MARGIN: 0.98
            OMNI_CACHE_PACKED_HBM: 1
          host_ip: 127.0.0.1
          master_node: p0
